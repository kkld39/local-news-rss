name: Update local news RSS
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'locations.yml'
      - 'newsrss/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/news.yml'

concurrency:
  group: local-news-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/configure-pages@v5
        id: pages
      - name: Generate RSS
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python -m newsrss.generate
      - name: Commit only changed output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds data index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Update local news RSS [skip ci]'
            git push origin HEAD
          fi
      - name: Prepare public files only
        run: |
          mkdir -p site
          cp -r feeds index.html site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
